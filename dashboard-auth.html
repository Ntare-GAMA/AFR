<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | AutoFarmsRwanda</title>
  <link rel="stylesheet" href="afr-theme.css">
</head>
<body style="background:linear-gradient(135deg,var(--green-dark) 0%,#0f2414 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px">

  <!-- bg glow -->
  <div style="position:fixed;top:-80px;right:-80px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(74,148,85,0.12),transparent 70%);pointer-events:none"></div>
  <div style="position:fixed;bottom:-60px;left:-60px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(200,146,42,0.07),transparent 70%);pointer-events:none"></div>

  <div style="width:100%;max-width:420px;position:relative">
    <!-- Logo mark -->
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:80px;height:80px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:32px">🔐</div>
      <h1 style="font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:6px">Admin Portal</h1>
      <p style="font-size:13px;color:rgba(255,255,255,0.45);font-weight:300">AutoFarmsRwanda Management System</p>
    </div>

    <div class="afr-card-white" style="border-radius:16px;padding:36px">
      <div id="alertBox" class="afr-alert"></div>

      <form id="adminLoginForm" action="https://formspree.io/f/mwvaaqqj" method="POST" class="afr-form">
        <div class="afr-form-group">
          <label for="email">Administrator Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@autofarmsrwanda.rw">
        </div>
        <div class="afr-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        <button type="submit" class="afr-btn afr-btn-primary" id="loginBtn" style="margin-top:4px">Sign In to Admin Panel</button>
      </form>

      <div style="border-top:1px solid rgba(26,58,31,0.1);margin-top:20px;padding-top:16px;text-align:center">
        <a href="index.html" style="font-size:13px;color:var(--green-mid);text-decoration:none;font-weight:500">← Back to Main Site</a>
      </div>

      <div class="afr-security">🔒 Secure administrator access only</div>
    </div>
  </div>

  <p style="margin-top:24px;font-size:12px;color:rgba(255,255,255,0.2)">&copy; 2025 AutoFarmsRwanda. All rights reserved.</p>

  <script>
    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('alertBox');
    const loginBtn = document.getElementById('loginBtn');

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `afr-alert afr-alert-${type} show`;
      setTimeout(() => alertBox.classList.remove('show'), 5000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminUser', JSON.stringify(data.user));
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 1000);
        } else {
          showAlert(data.error || 'Invalid credentials. Please try again.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In to Admin Panel';
        }
      } catch (err) {
        showAlert('Connection error. Please try again.', 'error');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In to Admin Panel';
      }
    });

    window.addEventListener('load', () => {
      if (localStorage.getItem('adminToken')) window.location.href = 'admin-dashboard.html';
    });
  </script>
</body>
</html>

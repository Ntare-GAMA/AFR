<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Login | AutoFarmsRwanda</title>
  <link rel="stylesheet" href="afr-theme.css">
</head>
<body style="background:var(--green-dark);display:flex;flex-direction:column;min-height:100vh">

  <nav class="afr-nav">
    <a href="index.html" class="afr-nav-logo">
      <div class="afr-nav-logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2C6 2 4 8 4 12c0 4 2 6 8 6s8-2 8-6c0-4-2-10-8-10z"/><path d="M12 18v4M9 22h6"/></svg></div>
      <span class="afr-nav-logo-text">AutoFarmsRwanda</span>
    </a>
    <ul class="afr-nav-links">
      <li><a href="investor-overview.html">Investment Overview</a></li>
      <li><a href="investor-registration.html">Register</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a href="investor-registration.html" class="afr-nav-cta">Apply Now</a>
  </nav>

  <!-- decorative blobs -->
  <div style="position:fixed;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(74,148,85,0.15),transparent 70%);pointer-events:none;z-index:0"></div>
  <div style="position:fixed;bottom:-80px;left:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(200,146,42,0.08),transparent 70%);pointer-events:none;z-index:0"></div>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;position:relative;z-index:1">
    <div style="width:100%;max-width:440px">

      <!-- logo mark -->
      <div style="text-align:center;margin-bottom:32px">
        <div style="width:72px;height:72px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="32" height="32"><path d="M12 2C6 2 4 8 4 12c0 4 2 6 8 6s8-2 8-6c0-4-2-10-8-10z"/><path d="M12 18v4M9 22h6"/></svg>
        </div>
        <h1 style="font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#fff;margin-bottom:6px">Welcome Back</h1>
        <p style="font-size:14px;color:rgba(255,255,255,0.55);font-weight:300">Access your investment portfolio</p>
      </div>

      <div class="afr-card-white" style="border-radius:16px;padding:36px">
        <div id="alertBox" class="afr-alert"></div>

        <form id="loginForm" action="https://formspree.io/f/mwvaaqqj" method="POST" class="afr-form">
          <div class="afr-form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="afr-form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
            <div style="text-align:right;margin-top:6px"><a href="#" style="font-size:12px;color:var(--green-mid);text-decoration:none;font-weight:500">Forgot password?</a></div>
          </div>
          <button type="submit" class="afr-btn afr-btn-primary" style="margin-top:4px">Sign In to Portfolio</button>
        </form>

        <div style="border-top:1px solid rgba(26,58,31,0.1);margin-top:22px;padding-top:18px;text-align:center">
          <p style="font-size:13px;color:var(--text-muted)">Don't have an account? <a href="investor-registration.html" style="color:var(--green-mid);font-weight:500;text-decoration:none">Apply as Investor →</a></p>
        </div>

        <div class="afr-security">🔒 Your connection is secure and encrypted</div>
      </div>

      <p style="text-align:center;margin-top:20px;font-size:13px;color:rgba(255,255,255,0.35)"><a href="index.html" style="color:rgba(255,255,255,0.4);text-decoration:none">← Back to Main Site</a></p>
    </div>
  </main>

  <footer style="background:rgba(0,0,0,0.3);text-align:center;padding:18px;font-size:12px;color:rgba(255,255,255,0.25);position:relative;z-index:1">
    &copy; 2025 AutoFarmsRwanda. All rights reserved.
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const response = await fetch('/api/investor/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'investor-dashboard.html';
        } else {
          alertBox.textContent = data.error || 'Invalid email or password';
          alertBox.className = 'afr-alert afr-alert-error show';
        }
      } catch (error) {
        alertBox.textContent = 'Connection error. Please try again.';
        alertBox.className = 'afr-alert afr-alert-error show';
      }
    });
  </script>
</body>
</html>

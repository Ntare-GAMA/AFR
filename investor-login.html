<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Login | AutoFarmsRwanda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0a1f1a 0%, #1a472a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: #000;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a472a;
    }

    .logo {
      color: #fff;
      font-size: 1.4rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2.5rem;
    }

    .nav-links a {
      color: #fff;
      text-decoration: none;
      transition: color 0.3s;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #28a745;
    }

    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .login-box {
      background: white;
      padding: 3rem;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      max-width: 450px;
      width: 100%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      color: #1a472a;
      font-size: 2rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #666;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: #333;
      font-weight: 600;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: all 0.3s;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a472a;
      box-shadow: 0 0 0 4px rgba(26, 71, 42, 0.08);
    }

    .forgot-password {
      text-align: right;
      margin-top: 0.5rem;
    }

    .forgot-password a {
      color: #1a472a;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #1a472a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      margin-top: 1.5rem;
    }

    .submit-btn:hover {
      background: #28a745;
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3);
      transform: translateY(-2px);
    }

    .divider {
      text-align: center;
      margin: 2rem 0;
      position: relative;
    }

    .divider:before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: #e0e0e0;
    }

    .divider span {
      background: white;
      padding: 0 1rem;
      position: relative;
      color: #666;
      font-size: 0.85rem;
    }

    .register-link {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e0e0e0;
    }

    .register-link p {
      color: #666;
      font-size: 0.9rem;
    }

    .register-link a {
      color: #1a472a;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .alert {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .alert-error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .alert-success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .security-notice {
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 6px;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #666;
      text-align: center;
    }

    .security-notice svg {
      vertical-align: middle;
      margin-right: 0.3rem;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .login-box {
        padding: 2rem 1.5rem;
      }

      .login-header h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">AutoFarmsRwanda</a>
    <ul class="nav-links">
      <li><a href="investor-overview.html">Investment Overview</a></li>
      <li><a href="investor-registration.html">Register</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1>Welcome Back</h1>
        <p>Access your investment portfolio</p>
      </div>

      <!-- Error/Success Messages (hidden by default) -->
      <!-- <div class="alert alert-error" style="display: none;">Invalid email or password</div> -->
      <!-- <div class="alert alert-success" style="display: none;">Login successful!</div> -->

      <form action="/api/investor/login" method="POST" id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <div class="forgot-password">
            <a href="password-reset.html">Forgot password?</a>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="register-link">
        <p>Don't have an account? <a href="investor-registration.html">Apply as Investor</a></p>
      </div>

      <div class="security-notice">
        🔒 Your connection is secure and encrypted
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 AutoFarmsRwanda. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/investor/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store token in localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          // Redirect to dashboard
          window.location.href = 'investor-dashboard.html';
        } else {
          // Show error message
          alert(data.error || 'Login failed. Please try again.');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred. Please try again.');
      }
    });
  </script>
</body>
</html>
